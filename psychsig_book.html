<style>
:root{color-scheme:dark;--ink:#f7edff;--lilac:#dcc2fc}
*{box-sizing:border-box}
html{min-height:100%;background:#231639}
body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 45% 0%,#50376e 0%,#291b43 45%,#160f29 100%);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:22px 12px 28px;overflow-x:hidden}
header{text-align:center;margin:0 0 16px}
.eyebrow{font-size:11px;letter-spacing:.27em;font-weight:750;color:var(--lilac)}
header h1{font-size:clamp(18px,5vw,25px);font-weight:650;letter-spacing:-.025em;margin:9px 0 3px}
header p{font-size:13px;color:#d7c4e8;margin:0}
.stage{width:100%;display:flex;align-items:center;justify-content:center;perspective:1400px;min-height:0;isolation:isolate;padding:7px 0 15px}
.book{width:min(78vw,370px,calc((100dvh - 180px)*.72));min-width:min(70vw,260px);aspect-ratio:1080/1500;position:relative;transform-style:preserve-3d;filter:drop-shadow(0 15px 24px #0904169e);transition:transform 1.05s ease;cursor:pointer;outline-offset:8px;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.book:focus-visible{outline:2px solid #d6aafb;border-radius:8px}
.sheet,.face{position:absolute;inset:0;border-radius:4px 12px 12px 4px;overflow:hidden}
.page{background:#fcf3e8;box-shadow:inset 10px 0 18px #55366835,0 2px 15px #0a061b40;z-index:1}
.sheet img,.face img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.cover{z-index:3;transform-style:preserve-3d;transform-origin:0 50%;transition:transform 1.1s cubic-bezier(.19,.74,.21,1);will-change:transform}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:inset 8px 0 16px #2b164d70}
.face.front{transform:translateZ(1px)}
.face.back{transform:rotateY(180deg) translateZ(1px);background:linear-gradient(90deg,#ddc5e8,#f6e8f2);border:1px solid #e4d1ec;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#4e3461;text-align:center;padding:20px}
.back .backmark{font-family:Georgia,serif;font-size:clamp(16px,5vw,27px);letter-spacing:.06em;margin:12px 0}.back .backhint{font-size:12px;opacity:.8;line-height:1.5}
.book.open{transform:translateX(7%)}
.book.open .cover{transform:rotateY(-174deg)}
.instructions{font-size:13px;color:#dfc9ef;margin:6px 0 13px;text-align:center;min-height:20px}
.controls{display:flex;justify-content:center;gap:10px;width:100%}
button{appearance:none;border:1px solid #b88dec;background:#8f5bc4;color:white;border-radius:999px;padding:12px 24px;font-size:14px;font-weight:700;min-width:160px;cursor:pointer;box-shadow:0 6px 18px #10071f57}
button:active{transform:scale(.98)}
footer{text-align:center;font-size:11px;color:#baa4cf;line-height:1.6;margin-top:13px}
@media(prefers-reduced-motion:reduce){.book,.cover{transition:none!important}}
</style>

<p class="instructions" id="instructions" aria-live="polite">Swipe left on the cover to open the book</p>
<div class="controls"><button id="toggle" type="button">📖 Open book</button></div>
<footer>Swipe left to open · Swipe right to close<br>Or use the button above</footer>
<script>
(()=>{
 const book=document.getElementById('book'),button=document.getElementById('toggle'),hint=document.getElementById('instructions');
 let opened=false,startX=null,startY=null;
 function setOpen(next){opened=next;book.classList.toggle('open',opened);book.setAttribute('aria-pressed',String(opened));book.setAttribute('aria-label',opened?'Close the book':'Open the book');button.textContent=opened?'↩ Close book':'📖 Open book';hint.textContent=opened?'Page 01 · Swipe right to close':'Swipe left on the cover to open the book';}
 book.addEventListener('touchstart',e=>{if(e.touches.length===1){startX=e.touches[0].clientX;startY=e.touches[0].clientY;}},{passive:true});
 book.addEventListener('touchend',e=>{if(startX===null||e.changedTouches.length!==1)return;const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;startX=startY=null;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.25){if(dx<0)setOpen(true);else setOpen(false);book.dataset.swiped='1';setTimeout(()=>delete book.dataset.swiped,350);}},{passive:true});
 book.addEventListener('click',()=>{if(book.dataset.swiped)return;setOpen(!opened)});
 book.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();setOpen(true)}else if(e.key==='ArrowRight'){e.preventDefault();setOpen(false)}else if(e.key==='Enter'||e.key===' '){e.preventDefault();setOpen(!opened)}});
 button.addEventListener('click',()=>setOpen(!opened));
})();
</script>
